<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F57C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA726;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" rx="180"/>
  
  <!-- Infinity loop representing continuous customer loyalty -->
  <g transform="translate(512, 512)">
    <!-- Left circle -->
    <circle cx="-150" cy="0" r="140" fill="none" stroke="white" stroke-width="45"/>
    <!-- Right circle -->
    <circle cx="150" cy="0" r="140" fill="none" stroke="white" stroke-width="45"/>
    
    <!-- Customer icon (person) in left circle -->
    <g transform="translate(-150, -30)">
      <circle cx="0" cy="0" r="25" fill="#F57C00"/>
      <path d="M -35,50 Q -35,20 -25,15 L -25,15 Q 0,5 25,15 L 25,15 Q 35,20 35,50 Z" 
            fill="#F57C00"/>
    </g>
    
    <!-- Reward star in right circle -->
    <g transform="translate(150, 0)">
      <path d="M 0,-30 L 7,-10 L 30,-10 L 12,5 L 18,25 L 0,12 L -18,25 L -12,5 L -30,-10 L -7,-10 Z" 
            fill="#F57C00"/>
    </g>
  </g>
  
  <!-- Notification bell at top right -->
  <g transform="translate(820, 200)">
    <circle cx="0" cy="0" r="50" fill="#FF5722"/>
    <path d="M -15,-10 L -15,-20 Q -15,-25 -10,-25 L 10,-25 Q 15,-25 15,-20 L 15,-10 Q 15,-5 20,0 L 20,5 L -20,5 L -20,0 Q -15,-5 -15,-10 Z M -5,10 Q -5,15 0,15 Q 5,15 5,10 Z" 
          fill="white"/>
  </g>
</svg>
