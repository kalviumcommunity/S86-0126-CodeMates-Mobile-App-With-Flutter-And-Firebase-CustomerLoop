<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #F57C00 0%, #FFA726 100%);
        }

        .icon {
            width: 512px;
            height: 512px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #F57C00 0%, #FFA726 100%);
            border-radius: 100px;
        }

        .infinity {
            font-size: 280px;
            color: white;
            font-weight: bold;
            text-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="icon">
        <div class="infinity">∞</div>
    </div>
</body>

</html>
